<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escalation Record - ESC-003</title> <!-- Changed Title -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="antialiased">
    <div class="container mx-auto p-4 md:p-8">
        <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-lg p-8 border border-gray-200">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">Escalation: ESC-003</h1> <!-- Changed Header -->
                    <p class="text-gray-500">Related to Case: <a href="./PROPOSAL_Support_Agent_View.html" class="text-blue-600 hover:underline">#0045981</a></p> <!-- Kept link, updated text if needed -->
                </div>
                 <!-- Updated status badge to be targetable by JS, kept Active -->
                <span id="escalation-status-badge" class="px-3 py-1 text-sm font-semibold text-red-800 bg-red-100 rounded-full">Active</span>
            </div>
            <div class="space-y-6 mt-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Escalation Start Date</label>
                        <input type="date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" value="2025-10-22"> <!-- Changed Date -->
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Escalation End Date</label>
                        <!-- Added id for JS targeting, kept empty for Active -->
                        <input id="escalation-end-date" type="date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" value="">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Escalated by</label>
                        <input type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" value="Sarah Adams"> <!-- Changed Name -->
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">SL Owner</label>
                        <input type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" value="John Anderson"> <!-- Changed Name -->
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Customer Temperature</label>
                        <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                            <option>Cool</option>
                            <option selected>Warm</option> <!-- Changed Temp -->
                            <option>Hot</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Escalation Reason</label>
                        <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                            <option>--None--</option>
                            <option>Client Temperature</option>
                            <option selected>Support Lag</option> <!-- Changed Reason -->
                        </select>
                    </div>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" class="h-4 w-4 rounded border-gray-300" checked> <!-- Kept checked -->
                    <label class="ml-2 block text-sm text-gray-900">Scope Check</label>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Escalation Details</label>
                    <textarea rows="5" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">Internal team has been unable to reproduce the reported bug after multiple attempts. Customer provided logs, but they don't show clear errors. Escalating to Tier 3 for deeper analysis and potentially a direct call with the customer to screenshare and observe the issue live. Delay is impacting their UAT cycle for a new product launch.</textarea> <!-- Changed Details -->
                </div>
                <div class="flex justify-end items-center pt-4 border-t space-x-3">
                     <!-- Kept De-escalate Button -->
                     <button id="de-escalate-btn" class="inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50">De-escalate</button>
                     <a href="./PROPOSAL_Support_Agent_View.html" class="inline-flex items-center rounded-md border border-transparent bg-blue-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-blue-700">Return to Case</a>
                </div>
            </div>
        </div>
    </div>

     <script>
        // Basic script to simulate de-escalation visually
        const deEscalateBtn = document.getElementById('de-escalate-btn');
        const statusBadge = document.getElementById('escalation-status-badge');
        const endDateInput = document.getElementById('escalation-end-date');
        
        if (deEscalateBtn && statusBadge && endDateInput) {
            deEscalateBtn.addEventListener('click', () => {
                // Change badge text and style
                statusBadge.textContent = 'Closed';
                statusBadge.classList.remove('text-red-800', 'bg-red-100');
                statusBadge.classList.add('text-gray-600', 'bg-gray-200');

                // Add today's date to the end date field if it's empty
                if (!endDateInput.value) {
                    const today = new Date().toISOString().split('T')[0];
                    endDateInput.value = today;
                }

                // Optionally: Disable or hide the de-escalate button after click
                deEscalateBtn.disabled = true;
                deEscalateBtn.classList.add('opacity-50', 'cursor-not-allowed');
                // Or hide it: deEscalateBtn.style.display = 'none'; 
            });
        }
    </script>

</body>
</html>
