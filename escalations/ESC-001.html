<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escalation Record - ESC-001</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="antialiased">
    <div class="container mx-auto p-4 md:p-8">
        <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-lg p-8 border border-gray-200">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">Escalation: ESC-001</h1>
                    <p class="text-gray-500">Related to Case: <a href="./PROPOSAL_Support_Agent_View.html" class="text-blue-600 hover:underline">#0045981</a></p>
                </div>
                <span class="px-3 py-1 text-sm font-semibold text-gray-600 bg-gray-200 rounded-full">Closed</span>
            </div>
            <div class="space-y-6 mt-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Escalation Start Date</label>
                        <input type="date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm bg-gray-100" value="2025-07-15" readonly>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Escalation End Date</label>
                        <input type="date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm bg-gray-100" value="2025-07-18" readonly>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Escalated by</label>
                        <input type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm bg-gray-100" value="Sarah Adams" readonly>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">SL Owner</label>
                        <input type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm bg-gray-100" value="John Anderson" readonly>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Customer Temperature</label>
                        <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm bg-gray-100 pointer-events-none" disabled>
                            <option>Cool</option>
                            <option selected>Warm</option>
                            <option>Hot</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Escalation Reason</label>
                        <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm bg-gray-100 pointer-events-none" disabled>
                            <option>--None--</option>
                            <option selected>Support Lag</option>
                            <option>Client Temperature</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" class="h-4 w-4 rounded border-gray-300" checked disabled>
                    <label class="ml-2 block text-sm text-gray-900">Scope Check</label>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Escalation Details</label>
                    <textarea rows="5" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm bg-gray-100" readonly>The customer has followed up twice regarding the missing invoice without a resolution. The initial response SLA was met, but the time to provide a meaningful update has lapsed, increasing client temperature from Cool to Warm. Escalating to ensure accounting team provides the invoice copy today.</textarea>
                </div>
                <div class="text-right pt-4 border-t">
                     <a href="./PROPOSAL_Support_Agent_View.html" class="inline-flex items-center rounded-md border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50">Return to Case</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
